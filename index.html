<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EVoLuMentaL" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3B2B20" />
    <meta name="description" content="EVoLuMentaL Control — controle de estudos: concursos, faculdade, carreira em tecnologia, idiomas e o que mais você estudar." />
    <title>EVoLuMentaL Control</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('evl:theme') || '"light"');
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
      // Aberto como aplicativo instalado (ícone na tela inicial) ou no navegador.
      if (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) document.documentElement.dataset.app = 'standalone';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
